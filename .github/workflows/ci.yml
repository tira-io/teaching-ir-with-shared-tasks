name: CI
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-code-check:
    name: 🔍 Check Python code
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Check-out
      uses: actions/checkout@v7
    - name: 🧰 Install Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: 🧰 Install dependencies
      run: pip install .[tests]
    - name: 🔍 Check Python code
      run: ruff check cli
  python-typing:
    name: 🔍 Check Python static typing
    strategy:
      matrix:
        python:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Check-out
      uses: actions/checkout@v7
    - name: 🧰 Install Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: 🧰 Install dependencies
      run: pip install .[tests]
    - name: 🔍 Check Python static typing
      run: mypy cli
  python-test:
    name: 🧪 Test Python code
    strategy:
      matrix:
        python:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Check-out
      uses: actions/checkout@v7
    - name: 🧰 Install Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: 🧰 Install dependencies
      run: pip install .[tests]
    - name: 🧪 Test Python code
      run: pytest --cov=cli cli
  docker-build:
    name: 🏗️ Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check-out
        uses: actions/checkout@v7
      - name: 🧰 Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: 🧰 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🏗️ Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          push: false
  docker-publish:
    name: 🚀 Publish Docker image
    if: github.event_name == 'push' && endsWith(github.event.base_ref, 'main') && startsWith(github.ref, 'refs/tags')
    permissions:
      contents: read
      packages: write
    needs:
      - python-code-check
      - python-typing
      - python-test
      - docker-build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check-out
        uses: actions/checkout@v7
      - name: 🧰 Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: 🧰 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🔑 Login to GitHub Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: ℹ️ Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
      - name: 🚀 Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  node-build-dashboard:
    name: 🏗️ Build dashboard Node app
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check-out
        uses: actions/checkout@v7
      - name: 🧰 Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 🧰 Install Python dependencies
        run: python -m pip install pyyaml~=6.0
      - name: 🏗️ Pre-process data
        working-directory: dashboard/
        run: python3 process_data.py
      - name: 🧰 Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: dashboard/yarn.lock
      - name: 🧰 Install Node dependencies
        working-directory: dashboard/
        run: yarn
      - name: 🏗️ Build dashboard Node app
        working-directory: dashboard/
        run: |
          yarn build
          cp src/resources/ir-lab-guidelines-sose-2024.pdf dist/
      - name: 📤 Upload app for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/dist/
  node-check-dashboard:
    name: 🔍 Check dashboard Node app code
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check-out
        uses: actions/checkout@v7
      - name: 🧰 Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: dashboard/yarn.lock
      - name: 🧰 Install Node dependencies
        working-directory: dashboard/
        run: yarn
      - name: 🔍 Check dashboard Node app code
        working-directory: dashboard/
        run: yarn lint
  # TODO: Add a node-test-dashboard job (yarn test) once the dashboard has tests.
  deploy-dashboard:
    name: 🚀 Deploy dashboard to GitHub Pages
    if: github.event_name == 'push' && endsWith(github.event.base_ref, 'main') && startsWith(github.ref, 'refs/tags')
    needs:
      - node-build-dashboard
      - node-check-dashboard
    environment:
      name: GitHub Pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued. But do not cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: 🧰 Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
