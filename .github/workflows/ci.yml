name: CI
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-code-check:
    name: 🔍 Check Python code
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Check-out
      uses: actions/checkout@v5
    - name: 🧰 Install Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: 🧰 Install dependencies
      run: pip install .[tests]
    - name: 🔍 Check Python code
      run: ruff check cli
  python-typing:
    name: 🔍 Check Python static typing
    strategy:
      matrix:
        python:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Check-out
      uses: actions/checkout@v5
    - name: 🧰 Install Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: 🧰 Install dependencies
      run: pip install .[tests]
    - name: 🔍 Check Python static typing
      run: mypy cli
  python-test:
    name: 🧪 Test Python code
    strategy:
      matrix:
        python:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Check-out
      uses: actions/checkout@v5
    - name: 🧰 Install Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: 🧰 Install dependencies
      run: pip install .[tests]
    - name: 🧪 Test Python code
      run: pytest --cov=cli cli
  deploy-dashboard:
    name: "Deploy dashboard to GitHub Pages"
    environment:
      name: GitHub Pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued. But do not cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5     
      - name: 🧰 Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: 🧰 Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 🧰 Install Python dependencies
        run: python -m pip install pyyaml~=6.0
      - name: 🏗️ Pre-process data
        working-directory: dashboard
        run: python3 process_data.py
      - name: 🧰 Setup Node/Yarn
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: dashboard/yarn.lock
      - name: 🧰 Install Yarn dependencies
        working-directory: dashboard
        run: yarn
      - name: 🧪 Lint dashboard web app
        working-directory: dashboard
        run: yarn lint
      # - name: 🧪 Test dashboard web app
      #   working-directory: dashboard
      #   run: yarn test
      - name: 🏗️ Build dashboard web app
        working-directory: dashboard
        run: |
          yarn build
          cp src/resources/ir-lab-guidelines-sose-2024.pdf dist/
      - name: 📤 Upload web app artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard/dist/
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
